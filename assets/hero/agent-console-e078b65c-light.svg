<rect x="508" y="48" width="655" height="640" rx="14" fill="#ffffff" fill-opacity="0.5" stroke="url(#border)" stroke-opacity="0.4"/>
<text x="30" y="62" class="panel-title">~/visual.md</text>
<text x="524" y="62" class="panel-title">~/profile.sh</text>

  <!-- Animated </> code symbol -->
  <text
    x="258"
    y="355.5"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Courier New', Consolas, monospace"
    font-size="90"
    font-weight="700"
    fill="#0969da"
    filter="url(#code-symbol-glow)"
    style="letter-spacing: -0.02em;"
  >
    </>
    <!-- Fade in/out animation -->
    <animate
      attributeName="opacity"
      values="0;1;1;0;0"
      keyTimes="0;0.15;0.85;1;1"
      dur="5s"
      repeatCount="indefinite"
      begin="0.5s"
    />
    <!-- Color pulse animation (cyan to violet to blue and back) -->
    <animate
      attributeName="fill"
      values="#0969da;#8250df;#0a3069;#0969da"
      dur="8s"
      repeatCount="indefinite"
    />
  </text>

  <!-- Subtle scanning line effect behind the symbol -->
  <line
    x1="44"
    y1="324"
    x2="472"
    y2="324"
    stroke="#0969da"
    stroke-width="0.5"
    stroke-dasharray="8,12"
    opacity="0.3"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="20"
      dur="3s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0.1;0.3;0.1"
      dur="4s"
      repeatCount="indefinite"
    />
  </line>

  <!-- Accent brackets at corners -->
  <g fill="none" stroke="#0a3069" stroke-width="1.5" opacity="0.4">
    <!-- Top-left -->
    <path d="M 34 84 L 34 114 L 64 114"/>
    <!-- Top-right -->
    <path d="M 482 84 L 482 114 L 452 114"/>
    <!-- Bottom-left -->
    <path d="M 34 564 L 34 534 L 64 534"/>
    <!-- Bottom-right -->
    <path d="M 482 564 L 482 534 534"/>
  </g>

