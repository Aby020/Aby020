<text x="66" y="116" class="panel-title">~/visual.md</text>
<text x="66" y="512" class="panel-title">~/profile.sh</text>

  <!-- Animated </> code symbol -->
  <text
    x="360"
    y="321"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Courier New', Consolas, monospace"
    font-size="120"
    font-weight="700"
    fill="#0969da"
    filter="url(#code-symbol-glow)"
    style="letter-spacing: -0.02em;"
  >
    </>
    <!-- Fade in/out animation -->
    <animate
      attributeName="opacity"
      values="0;1;1;0;0"
      keyTimes="0;0.15;0.85;1;1"
      dur="5s"
      repeatCount="indefinite"
      begin="0.5s"
    />
    <!-- Color pulse animation (cyan to violet to blue and back) -->
    <animate
      attributeName="fill"
      values="#0969da;#8250df;#0a3069;#0969da"
      dur="8s"
      repeatCount="indefinite"
    />
  </text>

  <!-- Subtle scanning line effect behind the symbol -->
  <line
    x1="78"
    y1="279"
    x2="642"
    y2="279"
    stroke="#0969da"
    stroke-width="0.5"
    stroke-dasharray="8,12"
    opacity="0.3"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="20"
      dur="3s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0.1;0.3;0.1"
      dur="4s"
      repeatCount="indefinite"
    />
  </line>

  <!-- Accent brackets at corners -->
  <g fill="none" stroke="#0a3069" stroke-width="1.5" opacity="0.4">
    <!-- Top-left -->
    <path d="M 68 114 L 68 144 L 98 144"/>
    <!-- Top-right -->
    <path d="M 652 114 L 652 144 L 622 144"/>
    <!-- Bottom-left -->
    <path d="M 68 444 L 68 414 L 98 414"/>
    <!-- Bottom-right -->
    <path d="M 652 444 L 652 414 414"/>
  </g>

