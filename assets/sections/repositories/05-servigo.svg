<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 96" width="700" height="96">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
    .row{animation:fadeUp .5s ease-out .15s both}
    .st{animation:pulse 3s ease-in-out infinite}
  </style>
  <g class="row">
    <rect x="0" y="0" width="3" height="96" fill="#a371f7" rx="1.5" opacity="0.8"/>
    <text x="16" y="22" fill="#a371f7" font-size="15" font-weight="bold">05</text>
    <text x="52" y="22" fill="#f0f6fc" font-size="19" font-weight="bold">ServiGo</text>
    <circle cx="140" cy="17" r="3.5" fill="#3fb950" class="st"/>
    <text x="16" y="44" fill="#8b949e" font-size="14">home services · EV charging</text>
    <text x="16" y="64" fill="#c9d1d9" font-size="13">Python · Django · Bootstrap · SQLite</text>
  </g>
</svg>
