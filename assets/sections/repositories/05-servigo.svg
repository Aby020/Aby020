<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 112" width="700" height="112">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
    .row{animation:fadeUp .5s ease-out .15s both}
    .st{animation:pulse 3s ease-in-out infinite}
  </style>
  <g class="row">
    <rect x="0" y="0" width="3" height="112" fill="#a371f7" rx="1.5" opacity="0.8"/>
    <text x="16" y="27" fill="#a371f7" font-size="18" font-weight="bold">05</text>
    <text x="52" y="27" fill="#f0f6fc" font-size="23" font-weight="bold">ServiGo</text>
    <circle cx="168" cy="21" r="4" fill="#3fb950" class="st"/>
    <text x="16" y="56" fill="#8b949e" font-size="16">home services · EV charging</text>
    <text x="16" y="81" fill="#c9d1d9" font-size="15">Python · Django · Bootstrap · SQLite</text>
  </g>
</svg>