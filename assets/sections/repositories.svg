<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#58a6ff" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes scanMove{0%{transform:translateY(-120px)}100%{transform:translateY(1200px)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
    .cursor{animation:blink 1s step-end infinite}
    .scan{animation:scanMove 12s linear infinite}
    .p1{animation:fadeUp .5s ease-out .6s both}
    .p2{animation:fadeUp .5s ease-out .9s both}
    .p3{animation:fadeUp .5s ease-out 1.2s both}
    .p4{animation:fadeUp .5s ease-out 1.5s both}
    .p5{animation:fadeUp .5s ease-out 1.8s both}
    .st{animation:pulse 3s ease-in-out infinite}
  </style>

  <!-- background -->
  <rect width="1200" height="1080" fill="url(#bg)" rx="12"/>

  <!-- subtle grid -->
  <g opacity="0.025" stroke="#58a6ff" stroke-width="0.5" fill="none">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1080"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1000" y1="0" x2="1000" y2="1080"/>
  </g>

  <!-- scan line -->
  <rect class="scan" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>

  <!-- border -->
  <rect width="1198" height="1078" x="1" y="1" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- title bar -->
  <rect width="1200" height="52" fill="#161b22" rx="12"/>
  <rect y="40" width="1200" height="12" fill="#161b22"/>
  <rect width="1200" height="1" y="52" fill="#30363d"/>

  <!-- macOS dots -->
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <!-- title -->
  <text x="100" y="31" fill="#8b949e" font-size="14">// repositories</text>
  <text x="1136" y="31" fill="#484f58" font-size="13" text-anchor="end">05 projects</text>

  <!-- command -->
  <text x="40" y="88" fill="#79c0ff" font-size="15" filter="url(#glow)">$</text>
  <text x="60" y="88" fill="#c9d1d9" font-size="15">ls -1 ./projects</text>
  <rect class="cursor" x="235" y="75" width="8" height="17" fill="#58a6ff" opacity="0.8" rx="1"/>

  <!-- separator -->
  <line x1="40" y1="108" x2="1160" y2="108" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 01 TrustFund ═══════ -->
  <g class="p1">
    <rect x="40" y="126" width="3" height="128" fill="#d29922" rx="1.5" opacity="0.8"/>
    <text x="58" y="148" fill="#d29922" font-size="14" font-weight="bold">01</text>
    <text x="92" y="148" fill="#f0f6fc" font-size="17" font-weight="bold">TrustFund</text>
    <circle cx="233" cy="143" r="3.5" fill="#3fb950" class="st"/>
    <text x="58" y="170" fill="#8b949e" font-size="13">donation · fundraising</text>
    <text x="58" y="190" fill="#484f58" font-size="12">React · TypeScript · Django · DRF · PostgreSQL · Razorpay · JWT</text>
    <text x="58" y="214" fill="#58a6ff" font-size="12">github.com/Aby020/TrustFund</text>
    <text x="58" y="234" fill="#3fb950" font-size="12">trustfund-i8r1.onrender.com</text>
    <text x="848" y="234" fill="#3fb950" font-size="11" opacity="0.6">★ live demo</text>
  </g>
  <line x1="58" y1="270" x2="1142" y2="270" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 02 Plannix ═══════ -->
  <g class="p2">
    <rect x="40" y="288" width="3" height="128" fill="#79c0ff" rx="1.5" opacity="0.8"/>
    <text x="58" y="310" fill="#79c0ff" font-size="14" font-weight="bold">02</text>
    <text x="92" y="310" fill="#f0f6fc" font-size="17" font-weight="bold">Plannix</text>
    <circle cx="189" cy="305" r="3.5" fill="#3fb950" class="st"/>
    <text x="58" y="332" fill="#8b949e" font-size="13">event management · booking</text>
    <text x="58" y="352" fill="#484f58" font-size="12">Django · Python · Bootstrap · SQLite</text>
    <text x="58" y="376" fill="#58a6ff" font-size="12">github.com/Aby020/Plannix</text>
    <text x="58" y="396" fill="#3fb950" font-size="12">plannix-0to5.onrender.com</text>
    <text x="848" y="396" fill="#3fb950" font-size="11" opacity="0.6">★ live demo</text>
  </g>
  <line x1="58" y1="432" x2="1142" y2="432" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 03 ResumeAI ═══════ -->
  <g class="p3">
    <rect x="40" y="450" width="3" height="128" fill="#ff7b72" rx="1.5" opacity="0.8"/>
    <text x="58" y="472" fill="#ff7b72" font-size="14" font-weight="bold">03</text>
    <text x="92" y="472" fill="#f0f6fc" font-size="17" font-weight="bold">ResumeAI</text>
    <circle cx="197" cy="467" r="3.5" fill="#3fb950" class="st"/>
    <text x="58" y="494" fill="#8b949e" font-size="13">resume analysis · ATS optimization</text>
    <text x="58" y="514" fill="#484f58" font-size="12">Python · Django · PostgreSQL · spaCy · PDF Parsing</text>
    <text x="58" y="538" fill="#58a6ff" font-size="12">github.com/Aby020/ResumeAI</text>
    <text x="58" y="558" fill="#3fb950" font-size="12">resumeai-backend-8rza.onrender.com</text>
    <text x="848" y="558" fill="#3fb950" font-size="11" opacity="0.6">★ live demo</text>
  </g>
  <line x1="58" y1="594" x2="1142" y2="594" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 04 TrackWise ═══════ -->
  <g class="p4">
    <rect x="40" y="612" width="3" height="128" fill="#f0883e" rx="1.5" opacity="0.8"/>
    <text x="58" y="634" fill="#f0883e" font-size="14" font-weight="bold">04</text>
    <text x="92" y="634" fill="#f0f6fc" font-size="17" font-weight="bold">TrackWise</text>
    <circle cx="201" cy="629" r="3.5" fill="#3fb950" class="st"/>
    <text x="58" y="656" fill="#8b949e" font-size="13">attendance management · dashboards</text>
    <text x="58" y="676" fill="#484f58" font-size="12">React · Node.js · Express.js · PostgreSQL · Tailwind CSS · JWT</text>
    <text x="58" y="700" fill="#58a6ff" font-size="12">github.com/Aby020/TrackWise</text>
    <text x="58" y="720" fill="#3fb950" font-size="12">trackwise-frontend-tla4.onrender.com</text>
    <text x="848" y="720" fill="#3fb950" font-size="11" opacity="0.6">★ live demo</text>
  </g>
  <line x1="58" y1="756" x2="1142" y2="756" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 05 ServiGo ═══════ -->
  <g class="p5">
    <rect x="40" y="774" width="3" height="128" fill="#a371f7" rx="1.5" opacity="0.8"/>
    <text x="58" y="796" fill="#a371f7" font-size="14" font-weight="bold">05</text>
    <text x="92" y="796" fill="#f0f6fc" font-size="17" font-weight="bold">ServiGo</text>
    <circle cx="185" cy="791" r="3.5" fill="#3fb950" class="st"/>
    <text x="58" y="818" fill="#8b949e" font-size="13">home services · EV charging</text>
    <text x="58" y="838" fill="#484f58" font-size="12">Python · Django · Bootstrap · SQLite</text>
    <text x="58" y="862" fill="#58a6ff" font-size="12">github.com/Aby020/ServiGo</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="922" x2="1160" y2="922" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="950" fill="#30363d" font-size="12">05 projects listed</text>
  <circle cx="1136" cy="946" r="4" fill="#3fb950" opacity="0.6"/>
  <text x="1120" y="950" fill="#30363d" font-size="12" text-anchor="end">complete</text>

  <!-- bottom padding -->
  <rect y="966" width="1200" height="114" fill="#0d1117" opacity="0"/>
</svg>
