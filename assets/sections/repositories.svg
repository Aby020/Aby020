<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#58a6ff" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes scanMove{0%{transform:translateY(-120px)}100%{transform:translateY(1320px)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
    .cursor{animation:blink 1s step-end infinite}
    .scan{animation:scanMove 14s linear infinite}
    .p1{animation:fadeUp .5s ease-out .6s both}
    .p2{animation:fadeUp .5s ease-out .9s both}
    .p3{animation:fadeUp .5s ease-out 1.2s both}
    .p4{animation:fadeUp .5s ease-out 1.5s both}
    .p5{animation:fadeUp .5s ease-out 1.8s both}
    .st{animation:pulse 3s ease-in-out infinite}
  </style>

  <!-- background -->
  <rect width="1200" height="1200" fill="url(#bg)" rx="12"/>

  <!-- subtle grid -->
  <g opacity="0.025" stroke="#58a6ff" stroke-width="0.5" fill="none">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="0" y1="1000" x2="1200" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1200"/>
    <line x1="400" y1="0" x2="400" y2="1200"/>
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="800" y1="0" x2="800" y2="1200"/>
    <line x1="1000" y1="0" x2="1000" y2="1200"/>
  </g>

  <!-- scan line -->
  <rect class="scan" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>

  <!-- border -->
  <rect width="1198" height="1198" x="1" y="1" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- title bar -->
  <rect width="1200" height="52" fill="#161b22" rx="12"/>
  <rect y="40" width="1200" height="12" fill="#161b22"/>
  <rect width="1200" height="1" y="52" fill="#30363d"/>

  <!-- macOS dots -->
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <!-- title -->
  <text x="100" y="31" fill="#8b949e" font-size="15">// repositories</text>
  <text x="1136" y="31" fill="#484f58" font-size="14" text-anchor="end">05 projects</text>

  <!-- command -->
  <text x="40" y="88" fill="#79c0ff" font-size="16" filter="url(#glow)">$</text>
  <text x="62" y="88" fill="#c9d1d9" font-size="16">ls -1 ./projects</text>
  <rect class="cursor" x="248" y="74" width="9" height="18" fill="#58a6ff" opacity="0.8" rx="1"/>

  <!-- separator -->
  <line x1="40" y1="110" x2="1160" y2="110" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 01 TrustFund ═══════ -->
  <g class="p1">
    <rect x="40" y="130" width="4" height="168" fill="#d29922" rx="2" opacity="0.8"/>
    <text x="60" y="158" fill="#d29922" font-size="17" font-weight="bold">01</text>
    <text x="98" y="158" fill="#f0f6fc" font-size="23" font-weight="bold">TrustFund</text>
    <circle cx="258" cy="152" r="4" fill="#3fb950" class="st"/>
    <text x="60" y="186" fill="#8b949e" font-size="16">donation · fundraising</text>
    <text x="60" y="212" fill="#c9d1d9" font-size="14">React · TypeScript · Django · DRF · PostgreSQL · Razorpay · JWT</text>
  </g>
  <line x1="60" y1="328" x2="1140" y2="328" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 02 Plannix ═══════ -->
  <g class="p2">
    <rect x="40" y="346" width="4" height="168" fill="#79c0ff" rx="2" opacity="0.8"/>
    <text x="60" y="374" fill="#79c0ff" font-size="17" font-weight="bold">02</text>
    <text x="98" y="374" fill="#f0f6fc" font-size="23" font-weight="bold">Plannix</text>
    <circle cx="210" cy="368" r="4" fill="#3fb950" class="st"/>
    <text x="60" y="402" fill="#8b949e" font-size="16">event management · booking</text>
    <text x="60" y="428" fill="#c9d1d9" font-size="14">Django · Python · Bootstrap · SQLite</text>
  </g>
  <line x1="60" y1="544" x2="1140" y2="544" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 03 ResumeAI ═══════ -->
  <g class="p3">
    <rect x="40" y="562" width="4" height="168" fill="#ff7b72" rx="2" opacity="0.8"/>
    <text x="60" y="590" fill="#ff7b72" font-size="17" font-weight="bold">03</text>
    <text x="98" y="590" fill="#f0f6fc" font-size="23" font-weight="bold">ResumeAI</text>
    <circle cx="218" cy="584" r="4" fill="#3fb950" class="st"/>
    <text x="60" y="618" fill="#8b949e" font-size="16">resume analysis · ATS optimization</text>
    <text x="60" y="644" fill="#c9d1d9" font-size="14">Python · Django · PostgreSQL · spaCy · PDF Parsing</text>
  </g>
  <line x1="60" y1="760" x2="1140" y2="760" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 04 TrackWise ═══════ -->
  <g class="p4">
    <rect x="40" y="778" width="4" height="168" fill="#f0883e" rx="2" opacity="0.8"/>
    <text x="60" y="806" fill="#f0883e" font-size="17" font-weight="bold">04</text>
    <text x="98" y="806" fill="#f0f6fc" font-size="23" font-weight="bold">TrackWise</text>
    <circle cx="222" cy="800" r="4" fill="#3fb950" class="st"/>
    <text x="60" y="834" fill="#8b949e" font-size="16">attendance management · dashboards</text>
    <text x="60" y="860" fill="#c9d1d9" font-size="14">React · Node.js · Express.js · PostgreSQL · Tailwind CSS · JWT</text>
  </g>
  <line x1="60" y1="976" x2="1140" y2="976" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════ 05 ServiGo ═══════ -->
  <g class="p5">
    <rect x="40" y="994" width="4" height="168" fill="#a371f7" rx="2" opacity="0.8"/>
    <text x="60" y="1022" fill="#a371f7" font-size="17" font-weight="bold">05</text>
    <text x="98" y="1022" fill="#f0f6fc" font-size="23" font-weight="bold">ServiGo</text>
    <circle cx="202" cy="1016" r="4" fill="#3fb950" class="st"/>
    <text x="60" y="1050" fill="#8b949e" font-size="16">home services · EV charging</text>
    <text x="60" y="1076" fill="#c9d1d9" font-size="14">Python · Django · Bootstrap · SQLite</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="1150" x2="1160" y2="1150" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="1178" fill="#30363d" font-size="13">05 projects listed</text>
  <circle cx="1136" cy="1174" r="4" fill="#3fb950" opacity="0.6"/>
  <text x="1120" y="1178" fill="#30363d" font-size="13" text-anchor="end">complete</text>

  <!-- bottom padding -->
  <rect y="1190" width="1200" height="10" fill="#0d1117" opacity="0"/>
</svg>
