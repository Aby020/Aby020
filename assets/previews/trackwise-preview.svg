<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="title desc">
<title id="title">TrackWise project preview</title>
<desc id="desc">Code-style preview of the TrackWise employee attendance management platform.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#161b22"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/>
    <stop offset="1" stop-color="#4f46e5"/>
  </linearGradient>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .kw { fill: #c084fc; }
    .str { fill: #a5d6ff; }
    .com { fill: #8b949e; }
    .fn { fill: #d2a8ff; }
    .op { fill: #79c0ff; }
    .jsx { fill: #f0883e; }
    .txt { fill: #e6edf3; }
  </style>
</defs>

<rect width="400" height="220" rx="10" fill="url(#bg)"/>
<rect x="0" y="0" width="400" height="38" rx="10" fill="#161b22"/>
<circle cx="16" cy="19" r="6" fill="#ff5f57"/>
<circle cx="32" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="48" cy="19" r="6" fill="#28ca42"/>
<text x="200" y="24" text-anchor="middle" class="mono" font-size="11" fill="#9aa4b2">trackwise / Dashboard.jsx</text>
<rect x="0" y="38" width="400" height="1" fill="#30363d"/>

<text x="16" y="60" class="mono" font-size="10.5">
  <tspan class="kw">import</tspan><tspan class="txt"> { useState, useEffect } </tspan><tspan class="kw">from</tspan><tspan class="str"> 'react'</tspan>
</text>
<text x="16" y="77" class="mono" font-size="10.5">
  <tspan class="kw">import</tspan><tspan class="txt"> { AttendanceChart } </tspan><tspan class="kw">from</tspan><tspan class="str"> './components'</tspan>
</text>
<text x="16" y="99" class="mono" font-size="10.5">
  <tspan class="com">// Employee attendance dashboard</tspan>
</text>
<text x="16" y="116" class="mono" font-size="10.5">
  <tspan class="kw">export default function</tspan><tspan class="fn"> Dashboard</tspan><tspan class="txt">() {'{'}</tspan>
</text>
<text x="28" y="133" class="mono" font-size="10.5">
  <tspan class="txt">const [records, </tspan><tspan class="kw">setRecords</tspan><tspan class="txt">] </tspan><tspan class="op">=</tspan><tspan class="txt"> </tspan><tspan class="fn">useState</tspan><tspan class="txt">([])</tspan>
</text>
<text x="28" y="150" class="mono" font-size="10.5">
  <tspan class="txt">const [stats, </tspan><tspan class="kw">setStats</tspan><tspan class="txt">] </tspan><tspan class="op">=</tspan><tspan class="txt"> </tspan><tspan class="fn">useState</tspan><tspan class="txt">({'{}'})</tspan>
</text>
<text x="28" y="167" class="mono" font-size="10.5">
  <tspan class="fn">useEffect</tspan><tspan class="txt">(() =&gt; {'{'}</tspan><tspan class="kw"> fetchAttendance</tspan><tspan class="txt">() {'}'} , [])</tspan>
</text>
<text x="16" y="190" class="mono" font-size="10.5">
  <tspan class="kw">return</tspan><tspan class="txt"> (</tspan><tspan class="jsx">&lt;AttendanceChart data={'{records}'} /&gt;</tspan><tspan class="txt">)</tspan>
</text>
<rect x="4" y="4" width="392" height="212" rx="10" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.7"/>
</svg>
