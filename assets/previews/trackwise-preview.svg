<rect width="400" height="220" rx="8" fill="url(#bg)"/>
<rect x="0" y="0" width="400" height="36" rx="8" fill="#161b22"/>
<circle cx="14" cy="18" r="6" fill="#ff5f57"/><circle cx="30" cy="18" r="6" fill="#ffbd2e"/><circle cx="46" cy="18" r="6" fill="#28ca42"/>
<text x="200" y="23" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">trackwise / Dashboard.jsx</text>
<rect x="0" y="36" width="400" height="1" fill="#30363d"/>
<text x="16" y="58" class="mono" font-size="11.5" fill="#e6edf3"><tspan class="keyword">import</tspan> <tspan class="jsx">{ useState, useEffect }</tspan> <tspan class="keyword">from</tspan> <tspan class="string">'react'</tspan></text>
<text x="16" y="76" class="mono" font-size="11.5" fill="#e6edf3"><tspan class="keyword">import</tspan> <tspan class="jsx">{ AttendanceChart }</tspan> <tspan class="keyword">from</tspan> <tspan class="string">'./components'</tspan></text>
<text x="16" y="100" class="mono" font-size="11.5" fill="#e6edf3"><tspan class="comment">// Employee attendance dashboard</tspan></text>
<text x="16" y="118" class="mono" font-size="11.5" fill="#e6edf3"><tspan class="keyword">export</tspan> <tspan class="keyword">default</tspan> <tspan class="keyword">function</tspan> <tspan class="function">Dashboard</tspan>() {</text>
<text x="32" y="136" class="mono" font-size="11.5" fill="#e6edf3"><tspan>const</tspan> <tspan>[records, <tspan class="keyword">setRecords</tspan>] <tspan class="operator">=</tspan> <tspan class="function">useState</tspan>([])</text>
<text x="32" y="154" class="mono" font-size="11.5" fill="#e6edf3"><tspan>const</tspan> <tspan>[stats, <tspan class="keyword">setStats</tspan>] <tspan class="operator">=</tspan> <tspan class="function">useState</tspan>({})</text>
<text x="32" y="172" class="mono" font-size="11.5" fill="#e6edf3"><tspan class="function">useEffect</tspan>(() => { <tspan class="keyword">fetchAttendance</tspan>() }, [])</text>
<text x="16" y="190" class="mono" font-size="11.5" fill="#e6edf3"><tspan class="keyword">return</tspan> <tspan class="jsx"><AttendanceChart data={records} /></tspan></text>
<rect x="4" y="4" width="392" height="212" rx="8" fill="none" stroke="url(#accent-cyan)" stroke-width="1.5" opacity="0.6"/>
