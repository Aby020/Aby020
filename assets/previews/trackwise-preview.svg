  <linearGradient id="accent-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <style>
    .mono { font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', monospace; }
